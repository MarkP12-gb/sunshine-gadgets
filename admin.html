/* ============================================================================
   DASHBOARD WIDGETS — revenue card + chart
   ============================================================================ */
function RevenueChart() {
  const points = [40, 90, 70, 150, 110, 190, 150, 210, 170, 230];
  const w = 460, h = 170, pad = 10;
  const step = (w - pad * 2) / (points.length - 1);
  const max = 240;
  const coords = points.map((v, i) => [pad + i * step, h - pad - (v / max) * (h - pad * 2)]);
  const line = coords.map(([x, y], i) => (i === 0 ? `M${x},${y}` : `L${x},${y}`)).join(" ");
  const area = `${line} L${coords[coords.length - 1][0]},${h - pad} L${coords[0][0]},${h - pad} Z`;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-40">
      <defs>
        <linearGradient id="rev-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#3B82F6" stopOpacity="0.25" />
          <stop offset="100%" stopColor="#3B82F6" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill="url(#rev-fill)" />
      <path d={line} fill="none" stroke="#2563EB" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

/* ============================================================================
   PRODUCT UPLOAD CENTER — matches the screenshot
   ============================================================================ */
function UploadCenter({ products, onAdd }) {
  const emptyForm = { name: "", category: "", price: "", stock: "", description: "" };
  const [form, setForm] = useState(emptyForm);
  const [fileName, setFileName] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const [toast, setToast] = useState("");
  const [saving, setSaving] = useState(false);
  const [toastIsError, setToastIsError] = useState(false);
  const fileInput = useRef(null);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const handleFiles = (files) => {
    if (files && files[0]) setFileName(files[0].name);
  };

  const submit = async () => {
    if (!form.name || !form.price) return;
    setSaving(true);
    try {
      await onAdd({
        name: form.name,
        brand: "Generic",
        category: form.category || CATEGORIES[0],
        price: Number(form.price) || 0,
        stock: Number(form.stock) || 0,
        subtitle: fileName ? "New arrival" : "",
        variants: ["Standard"],
        colors: ["Default"],
        description: form.description ? form.description.split("\n").filter(Boolean) : [],
        badge: "New",
        rating: 0,
        reviews: 0,
        status: "Live",
      });
      setForm(emptyForm);
      setFileName("");
      setToastIsError(false);
      setToast("Product uploaded — it's now live in the buyer app.");
    } catch (err) {
      setToastIsError(true);
      setToast("Couldn't upload — check your Supabase connection.");
    } finally {
      setSaving(false);
      setTimeout(() => setToast(""), 3500);
    }
  };

  return (
    <div className="bg-white rounded-2xl border border-gray-100 p-5 shadow-sm">
      <div
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}
        onClick={() => fileInput.current && fileInput.current.click()}
        className={`border-2 border-dashed rounded-xl flex flex-col items-center justify-center py-10 cursor-pointer transition-colors ${
          dragOver ? "border-blue-400 bg-blue-50" : "border-gray-200"
        }`}
      >
        <UploadCloud size={28} className="text-gray-400" strokeWidth={1.5} />
        <p className="text-sm text-gray-500 mt-3">
          {fileName ? fileName : "Drag & Drop Files Here or Click to Browse"}
        </p>
        <input ref={fileInput} type="file" className="hidden" onChange={(e) => handleFiles(e.target.files)} />
      </div>

      <div className="grid grid-cols-2 gap-4 mt-5">
        <div>
          <p className="text-xs font-medium text-gray-500 mb-1.5">Product Title</p>
          <input
            value={form.name}
            onChange={set("name")}
            className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none focus:border-blue-300"
          />
        </div>
        <div>
          <p className="text-xs font-medium text-gray-500 mb-1.5">Category</p>
          <select
            value={form.category}
            onChange={set("category")}
            className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none focus:border-blue-300"
          >
            <option value="">Category</option>
            {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div>
          <p className="text-xs font-medium text-gray-500 mb-1.5">Price (UGX)</p>
          <input
            value={form.price}
            onChange={set("price")}
            type="number"
            className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none focus:border-blue-300"
          />
        </div>
        <div>
          <p className="text-xs font-medium text-gray-500 mb-1.5">Stock Quantity</p>
          <input
            value={form.stock}
            onChange={set("stock")}
            type="number"
            className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none focus:border-blue-300"
          />
        </div>
        <div className="col-span-2">
          <p className="text-xs font-medium text-gray-500 mb-1.5">Description</p>
          <textarea
            value={form.description}
            onChange={set("description")}
            rows={3}
            placeholder={"One feature per line, e.g.\n6.8\" Dynamic AMOLED 2X\nSnapdragon 8 Gen 3"}
            className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none resize-none focus:border-blue-300"
          />
        </div>
      </div>

      <div className="flex items-center justify-between mt-5">
        <span className={`text-xs ${toastIsError ? "text-red-500" : "text-green-600"}`}>{toast}</span>
        <div className="flex gap-3">
          <button
            onClick={() => { setForm(emptyForm); setFileName(""); }}
            className="text-sm font-medium px-4 py-2 rounded-lg border border-gray-200 text-gray-600"
          >
            Cancel
          </button>
          <button
            onClick={submit}
            disabled={saving}
            className="text-sm font-semibold px-4 py-2 rounded-lg bg-blue-600 text-white disabled:opacity-60"
          >
            {saving ? "Uploading…" : "Upload Product"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   PRODUCTS PAGE — manage / edit / permanently delete
   ============================================================================ */
function ProductsPage({ products, onUpdate, onDelete }) {
  const [editing, setEditing] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [draft, setDraft] = useState(null);

  const startEdit = (p) => { setEditing(p.id); setDraft({ ...p }); };
  const saveEdit = () => {
    onUpdate(editing, {
      ...draft,
      price: Number(draft.price) || 0,
      stock: Number(draft.stock) || 0,
    });
    setEditing(null);
  };

  return (
    <div className="p-6">
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-xl font-bold text-gray-900">Products</h1>
        <p className="text-xs text-gray-400">{products.length} total</p>
      </div>

      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
        <div className="grid grid-cols-[1fr_120px_120px_90px_80px] gap-3 px-5 py-3 text-[11px] font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">
          <span>Product</span><span>Category</span><span>Price</span><span>Stock</span><span></span>
        </div>
        {products.map((p) => (
          <div key={p.id} className="grid grid-cols-[1fr_120px_120px_90px_80px] gap-3 px-5 py-3 items-center border-b border-gray-50 last:border-0">
            <div className="flex items-center gap-3 min-w-0">
              <ProductThumb />
              <span className="text-sm text-gray-800 truncate">{p.name}</span>
            </div>
            <span className="text-xs text-gray-500">{p.category}</span>
            <span className="text-xs text-gray-700 font-medium">{fmt(p.price)}</span>
            <span className="text-xs text-gray-500">{p.stock}</span>
            <div className="flex gap-2">
              <button onClick={() => startEdit(p)} className="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center">
                <Pencil size={12} className="text-gray-600" />
              </button>
              <button onClick={() => setConfirmDeleteId(p.id)} className="w-7 h-7 rounded-full bg-red-50 flex items-center justify-center">
                <Trash2 size={12} className="text-red-500" />
              </button>
            </div>
          </div>
        ))}
      </div>

      {editing !== null && draft && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center px-6 z-50">
          <div className="bg-white rounded-2xl p-6 w-full max-w-md">
            <div className="flex items-center justify-between mb-4">
              <p className="text-sm font-semibold text-gray-900">Edit product</p>
              <button onClick={() => setEditing(null)}><X size={16} className="text-gray-400" /></button>
            </div>
            <div className="space-y-3">
              <input
                value={draft.name}
                onChange={(e) => setDraft((d) => ({ ...d, name: e.target.value }))}
                className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none"
                placeholder="Product name"
              />
              <div className="grid grid-cols-2 gap-3">
                <input
                  value={draft.price}
                  onChange={(e) => setDraft((d) => ({ ...d, price: e.target.value }))}
                  type="number"
                  className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none"
                  placeholder="Price"
                />
                <input
                  value={draft.stock}
                  onChange={(e) => setDraft((d) => ({ ...d, stock: e.target.value }))}
                  type="number"
                  className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none"
                  placeholder="Stock"
                />
              </div>
              <select
                value={draft.category}
                onChange={(e) => setDraft((d) => ({ ...d, category: e.target.value }))}
                className="w-full text-sm bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5 outline-none"
              >
                {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
              </select>
            </div>
            <button onClick={saveEdit} className="w-full bg-blue-600 text-white text-sm font-semibold py-2.5 rounded-lg mt-5">
              Save changes
            </button>
          </div>
        </div>
      )}

      {confirmDeleteId !== null && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center px-6 z-50">
          <div className="bg-white rounded-2xl p-5 w-full max-w-sm">
            <p className="text-sm font-semibold text-gray-900">Delete this product?</p>
            <p className="text-xs text-gray-500 mt-1">This permanently removes it from the shop for every buyer. This can't be undone.</p>
            <div className="flex gap-3 mt-4">
              <button onClick={() => setConfirmDeleteId(null)} className="flex-1 text-sm font-medium py-2.5 rounded-xl bg-gray-100 text-gray-600">
                Cancel
              </button>
              <button
                onClick={() => { onDelete(confirmDeleteId); setConfirmDeleteId(null); }}
                className="flex-1 text-sm font-semibold py-2.5 rounded-xl bg-red-500 text-white"
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function LoginScreen({ onSignedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    try {
      const session = await signIn(email, password);
      onSignedIn(session);
    } catch (err) {
      setError(err.message || "Sign-in failed. Check your email and password.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen bg-gray-50 flex items-center justify-center px-6">
      <form onSubmit={submit} className="w-full max-w-sm bg-white border border-gray-100 rounded-2xl shadow-sm p-7">
        <div className="flex flex-col items-center mb-5">
          <BrandMark size={40} />
          <p className="text-base font-bold text-gray-900 mt-3">Sunshine Gadgets Admin</p>
          <p className="text-xs text-gray-400 mt-1 flex items-center gap-1"><Lock size={11} /> Owner sign-in required</p>
        </div>
        <div className="space-y-3">
          <div className="flex items-center gap-2 bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5">
            <Mail size={14} className="text-gray-400" />
            <input
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              type="email"
              required
              placeholder="you@sunshinegadgets.com"
              className="w-full text-sm bg-transparent outline-none"
            />
          </div>
          <div className="flex items-center gap-2 bg-gray-50 border border-gray-100 rounded-lg px-3 py-2.5">
            <KeyRound size={14} className="text-gray-400" />
            <input
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              type="password"
              required
              placeholder="Password"
              className="w-full text-sm bg-transparent outline-none"
            />
          </div>
        </div>
        {error && <p className="text-xs text-red-500 mt-3">{error}</p>}
        <button
          type="submit"
          disabled={loading}
          className="w-full bg-blue-600 text-white text-sm font-semibold py-2.5 rounded-lg mt-5 disabled:opacity-60"
        >
          {loading ? "Signing in…" : "Sign in"}
        </button>
        <p className="text-[11px] text-gray-300 text-center mt-4">
          Accounts are created in your Supabase project, not here — see SETUP.md.
        </p>
      </form>
    </div>
  );
}

function OrdersPage({ orders, loading }) {
  const statusTone = {
    pending: "bg-amber-50 text-amber-600",
    paid: "bg-green-50 text-green-600",
    failed: "bg-red-50 text-red-600",
    delivered: "bg-blue-50 text-blue-600",
    cancelled: "bg-gray-100 text-gray-500",
  };
  return (
    <div className="p-6">
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-xl font-bold text-gray-900">Orders</h1>
        <p className="text-xs text-gray-400">{orders.length} total</p>
      </div>

      {loading ? (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-10 text-center text-sm text-gray-400">
          Loading orders…
        </div>
      ) : orders.length === 0 ? (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-10 text-center text-sm text-gray-400">
          No orders yet — they'll show up here the moment a buyer checks out.
        </div>
      ) : (
        <div className="space-y-3">
          {orders.map((o) => (
            <div key={o.id} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
              <div className="flex items-center justify-between">
                <div>
                  <p className="text-sm font-semibold text-gray-900">#{o.order_ref.slice(0, 8).toUpperCase()}</p>
                  <p className="text-xs text-gray-400">{o.receipt_name} · {o.phone} · {o.location}</p>
                </div>
                <div className="text-right">
                  <p className="text-sm font-bold text-gray-900">{fmt(o.total)}</p>
                  <span className={`text-[10px] font-medium px-2 py-0.5 rounded-full ${statusTone[o.status] || "bg-gray-100 text-gray-500"}`}>
                    {o.status}
                  </span>
                </div>
              </div>
              {o.status === "paid" && (
                <p className={`text-[11px] mt-1.5 ${o.payout_status === "sent" ? "text-green-600" : "text-amber-600"}`}>
                  {o.payout_status === "sent"
                    ? "✓ Sent to your mobile money"
                    : o.payout_status === "failed"
                    ? "⚠ Auto-payout failed — withdraw this one manually from the MarzPay dashboard"
                    : "Payout pending…"}
                </p>
              )}
              {o.order_items && o.order_items.length > 0 && (
                <div className="mt-2 pt-2 border-t border-gray-50 space-y-1">
                  {o.order_items.map((it) => (
                    <p key={it.id} className="text-[11px] text-gray-500">
                      {it.qty} × {it.product_name} ({it.variant}, {it.color})
                    </p>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================================
   ROOT ADMIN APP
   ============================================================================ */
function AdminDashboardApp() {
  const [authLoading, setAuthLoading] = useState(true);
  const [session, setSession] = useState(null);

  React.useEffect(() => {
    getSession().then((s) => { setSession(s); setAuthLoading(false); });
    const unsub = onAuthChange(setSession);
    return unsub;
  }, []);

  const [products, setProducts] = useState([]);
  const [offlineDemo, setOfflineDemo] = useState(false);
  const [orders, setOrders] = useState([]);
  const [ordersLoading, setOrdersLoading] = useState(true);
  const [page, setPage] = useState("upload");

  React.useEffect(() => {
    if (!session) return;
    let unsubProducts = () => {};
    let unsubOrders = () => {};

    fetchProducts()
      .then(setProducts)
      .catch(() => { setProducts(seedProducts()); setOfflineDemo(true); });
    unsubProducts = subscribeToProducts(setProducts);

    fetchOrders()
      .then((data) => { setOrders(data); setOrdersLoading(false); })
      .catch(() => setOrdersLoading(false));
    unsubOrders = subscribeToOrders(setOrders);

    return () => { unsubProducts(); unsubOrders(); };
  }, [session]);

  const addProduct = async (payload) => {
    if (offlineDemo) { setProducts((p) => [...p, { ...payload, id: (p.at(-1)?.id || 0) + 1 }]); return; }
    await sbAddProduct(payload);
  };
  const updateProduct = async (id, payload) => {
    if (offlineDemo) { setProducts((p) => p.map((x) => (x.id === id ? { ...x, ...payload } : x))); return; }
    await sbUpdateProduct(id, payload);
  };
  const deleteProduct = async (id) => {
    if (offlineDemo) { setProducts((p) => p.filter((x) => x.id !== id)); return; }
    await sbDeleteProduct(id);
  };

  if (authLoading) {
    return (
      <div className="min-h-screen bg-gray-50 flex items-center justify-center">
        <RefreshCw size={20} className="text-gray-300 animate-spin" />
      </div>
    );
  }

  if (!session) {
    return <LoginScreen onSignedIn={setSession} />;
  }

  return (
    <div className="min-h-screen bg-gray-50 flex flex-col">
      <Topbar page={page} onNavigate={setPage} onSignOut={() => signOut()} />
      {offlineDemo && (
        <div className="bg-amber-50 text-amber-700 text-[11px] text-center py-1.5 px-3">
          Demo data — not connected to Supabase yet. Edit config.js and reload.
        </div>
      )}
      <div className="flex flex-1 min-h-0">
        <Sidebar page={page} onNavigate={setPage} />
        <div className="flex-1 overflow-y-auto">
          {page === "upload" && <DashboardPage products={products} onAdd={addProduct} />}
          {page === "dashboard" && <DashboardPage products={products} onAdd={addProduct} />}
          {page === "products" && (
            <ProductsPage products={products} onUpdate={updateProduct} onDelete={deleteProduct} />
          )}
          {page === "orders" && <OrdersPage orders={orders} loading={ordersLoading} />}
          {page === "customers" && <PlaceholderPage title="Customers" />}
          {page === "analytics" && <PlaceholderPage title="Analytics" />}
          {page === "settings" && <PlaceholderPage title="Settings" />}
        </div>
      </div>
    </div>
  );
}


createRoot(document.getElementById("root")).render(<AdminDashboardApp />);
</script>
