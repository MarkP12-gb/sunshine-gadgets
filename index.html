/* ============================================================================

   ============================================================================ */

function SunshineLogo({ size = 96 }) {

/* ============================================================================
   SMALL UI PRIMITIVES
   ============================================================================ */

function StarRating({ value }) {
  return (
    <span className="inline-flex items-center gap-0.5 text-xs text-gray-500">
      <Star size={12} className="fill-amber-400 text-amber-400" />
      {value.toFixed(1)}
    </span>
  );
}

function ProductThumb({ product, size = "full" }) {
  const meta = CATEGORY_META[product.category] || CATEGORY_META.Phones;
  const Icon = meta.icon;
  return (
    <div
      className="w-full h-full flex items-center justify-center rounded-xl"
      style={{ background: meta.color + "14" }}
    >
      <Icon size={size === "full" ? 40 : 26} style={{ color: meta.color }} strokeWidth={1.5} />
    </div>
  );
}

function Badge({ children, tone = "blue" }) {
  const tones = {
    blue: "bg-blue-600 text-white",
    amber: "bg-amber-400 text-gray-900",
  };
  return (
    <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${tones[tone]}`}>
      {children}
    </span>
  );
}

/* ============================================================================
   BUYER APP — HEADER / NAV
   ============================================================================ */

        <User size={16} className="text-white" />

      <button onClick={onCartClick} className="relative w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center shrink-0">
        <ShoppingCart size={16} className="text-white" />
        {cartCount > 0 && (
          <span className="absolute -top-1 -right-1 bg-amber-400 text-gray-900 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
            {cartCount}
          </span>
        )}
      </button>
    </div>
  );
}

function BottomNav({ active, onChange, cartCount }) {
  const items = [
    { key: "home", label: "Home", icon: HomeIcon },
    { key: "categories", label: "Categories", icon: LayoutGrid },
    { key: "deals", label: "Deals", icon: Tag },
    { key: "account", label: "Account", icon: UserCircle2 },
    { key: "cart", label: "Cart", icon: ShoppingCart },
  ];
  return (
    <div className="border-t border-gray-100 bg-white flex items-stretch">
      {items.map((it) => {
        const isActive = active === it.key;
        const Icon = it.icon;
        return (
          <button
            key={it.key}
            onClick={() => onChange(it.key)}
            className="flex-1 flex flex-col items-center justify-center gap-0.5 py-2 relative"
          >
            <Icon size={18} className={isActive ? "text-blue-600" : "text-gray-400"} strokeWidth={isActive ? 2.4 : 1.8} />
            <span className={`text-[10px] ${isActive ? "text-blue-600 font-medium" : "text-gray-400"}`}>{it.label}</span>
            {it.key === "cart" && cartCount > 0 && (
              <span className="absolute top-0.5 right-6 bg-amber-400 text-gray-900 text-[9px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">
                {cartCount}
              </span>
            )}
          </button>
        );
      })}
    </div>
  );
}

/* ============================================================================

            const Icon = meta.icon;

            See all <ChevronRight size={13} />
          </button>
        </div>
        <div className="grid grid-cols-2 gap-3">
          {deals.slice(0, 4).map((p) => (
            <ProductCard key={p.id} product={p} onOpen={() => onOpenProduct(p.id)} onQuickAdd={() => onQuickAdd(p)} />

function ProductCard({ product, onOpen, onQuickAdd }) {
  return (
    <button onClick={onOpen} className="text-left bg-white rounded-2xl border border-gray-100 shadow-sm p-2.5 relative">
      <div className="aspect-square mb-2 relative">
        <ProductThumb product={product} />
        {product.badge && (
          <span className="absolute top-1 left-1">
            <Badge tone={product.badge === "New" ? "blue" : "amber"}>{product.badge}</Badge>
          </span>
        )}
        <span
          onClick={(e) => { e.stopPropagation(); onQuickAdd(); }}
          className="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center shadow"
        >
          <Plus size={13} className="text-white" />
        </span>
      </div>
      <p className="text-xs font-semibold text-gray-900 leading-snug line-clamp-2">{product.name}</p>
      <p className="text-[11px] text-gray-400 mt-0.5 truncate">{product.subtitle}</p>
      <div className="flex items-center justify-between mt-1.5">
        <p className="text-xs font-bold text-gray-900">{fmt(product.price)}</p>
        <StarRating value={product.rating} />
      </div>
    </button>
  );
}

/* ============================================================================
   CATEGORY / BROWSE SCREEN
   ============================================================================ */

function BrowseScreen({ products, activeFilter, onFilter, onOpenProduct, onQuickAdd }) {
  const filtered = useMemo(() => {
    if (activeFilter === "All") return products;
    if (activeFilter === "__deals") return products.filter((p) => p.badge === "Deal");
    return products.filter((p) => p.category === activeFilter);
  }, [products, activeFilter]);

  const chips = ["All", ...CATEGORIES, "Brands"];

  return (
    <div className="pb-3">
      <div className="px-4 pt-1 pb-3 flex gap-2 overflow-x-auto no-scrollbar">
        {chips.map((c) => {
          const isActive = activeFilter === c || (c === "All" && activeFilter === "All");
          return (
            <button
              key={c}
              onClick={() => onFilter(c)}
              className={`shrink-0 text-xs font-medium px-3.5 py-1.5 rounded-full ${
                isActive ? "bg-blue-600 text-white" : "bg-gray-100 text-gray-600"
              }`}
            >
              {c}
            </button>
          );
        })}
      </div>
      <div className="px-4 grid grid-cols-2 gap-3">
        {filtered.map((p) => (
          <ProductCard key={p.id} product={p} onOpen={() => onOpenProduct(p.id)} onQuickAdd={() => onQuickAdd(p)} />
        ))}
        {filtered.length === 0 && (
          <p className="col-span-2 text-center text-sm text-gray-400 py-10">No products in this category yet.</p>
        )}
      </div>
    </div>
  );
}

        <div className="aspect-[4/3] bg-gray-50 flex items-center justify-center">
          <ProductThumb product={product} size="lg" />

        <button onClick={onBack} className="absolute top-4 left-4 w-8 h-8 rounded-full bg-white shadow flex items-center justify-center">
          <ChevronLeft size={17} />

      <div className="px-4 pt-4">
        <h2 className="text-lg font-bold text-gray-900">{product.name}</h2>

          <span className="flex items-center gap-1 text-sm text-gray-500">

        <div className="mt-4">

              <button
                key={c}

                  color === c ? "border-blue-600 bg-blue-50 text-blue-700 font-medium" : "border-gray-200 text-gray-600"

                {c}

            ))}
          </div>
        </div>

        <div className="mt-4">

          <div className="flex gap-2 flex-wrap">
            {product.variants.map((v) => (
              <button
                key={v}
                onClick={() => setVariant(v)}
                className={`text-xs px-3 py-1.5 rounded-lg border ${
                  variant === v ? "border-blue-600 bg-blue-50 text-blue-700 font-medium" : "border-gray-200 text-gray-600"
                }`}
              >
                {v}
              </button>
            ))}
          </div>
        </div>

        <div className="mt-5">
          <p className="text-sm font-semibold text-gray-900 mb-2">Description</p>
          <ul className="space-y-1.5">
            {product.description.map((d, i) => (
              <li key={i} className="text-xs text-gray-600 flex gap-2">
                <span className="w-1 h-1 rounded-full bg-gray-400 mt-1.5 shrink-0" />
                {d}
              </li>
            ))}
          </ul>
        </div>

        <p className="text-xs text-gray-400 mt-4">{product.stock > 0 ? `${product.stock} in stock` : "Out of stock"}</p>

        <div className="flex gap-3 mt-4">
          <button
            onClick={() => onAddToCart(product, variant, color)}
            className="flex-1 bg-blue-600 text-white text-sm font-semibold py-3 rounded-xl"
          >
            Add to Cart
          </button>
          <button
            onClick={() => onBuyNow(product, variant, color)}
            className="flex-1 bg-amber-400 text-gray-900 text-sm font-semibold py-3 rounded-xl"
          >
            Buy Now
          </button>
        </div>

        {related.length > 0 && (
          <div className="mt-7">
            <p className="text-sm font-semibold text-gray-900 mb-3">You may also like</p>
            <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
              {related.map((p) => (
                <button key={p.id} onClick={() => onOpenProduct(p.id)} className="w-24 shrink-0">
                  <div className="aspect-square"><ProductThumb product={p} size="sm" /></div>
                  <p className="text-[10px] text-gray-600 mt-1 truncate">{p.name}</p>
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================================
   CART SCREEN
   ============================================================================ */

function CartScreen({ cart, onQty, onRemove, onCheckout, onContinueShopping }) {
  const total = cart.reduce((s, c) => s + c.product.price * c.qty, 0);

  if (cart.length === 0) {
    return (
      <div className="px-4 pt-16 flex flex-col items-center text-center">
        <ShoppingCart size={40} className="text-gray-300" />
        <p className="text-sm text-gray-500 mt-3">Your cart is empty.</p>
        <button onClick={onContinueShopping} className="mt-4 text-sm text-blue-600 font-medium">
          Start shopping
        </button>
      </div>
    );
  }

  return (
    <div className="px-4 pb-4">
      <h2 className="text-base font-bold text-gray-900 pt-1 pb-3">Your Cart</h2>
      <div className="space-y-3">
        {cart.map((c) => (
          <div key={c.key} className="flex gap-3 bg-white border border-gray-100 rounded-xl p-2.5">
            <div className="w-16 h-16 shrink-0"><ProductThumb product={c.product} size="sm" /></div>
            <div className="flex-1 min-w-0">
              <p className="text-xs font-semibold text-gray-900 truncate">{c.product.name}</p>
              <p className="text-[11px] text-gray-400">{c.variant} · {c.color}</p>
              <div className="flex items-center justify-between mt-1.5">
                <p className="text-xs font-bold text-gray-900">{fmt(c.product.price)}</p>
                <div className="flex items-center gap-2">
                  <button onClick={() => onQty(c.key, -1)} className="w-6 h-6 rounded-full bg-gray-100 text-sm">–</button>
                  <span className="text-xs w-4 text-center">{c.qty}</span>
                  <button onClick={() => onQty(c.key, 1)} className="w-6 h-6 rounded-full bg-gray-100 text-sm">+</button>
                </div>
              </div>
            </div>
            <button onClick={() => onRemove(c.key)} className="self-start text-gray-300">
              <X size={15} />
            </button>
          </div>
        ))}
      </div>

      <div className="mt-5 border-t border-gray-100 pt-4 flex items-center justify-between">
        <span className="text-sm text-gray-500">Subtotal</span>
        <span className="text-base font-bold text-gray-900">{fmt(total)}</span>
      </div>
      <button onClick={onCheckout} className="w-full bg-blue-600 text-white text-sm font-semibold py-3 rounded-xl mt-4">
        Checkout
      </button>
    </div>
  );
}

/* ============================================================================
   CHECKOUT FLOW — location / receipt name / transport / phone / MTN·Airtel
   ============================================================================ */

function CheckoutScreen({ cart, onBack, onSubmit, checkoutError }) {
  const subtotal = cart.reduce((s, c) => s + c.product.price * c.qty, 0);
  const [form, setForm] = useState({
    location: "",
    receiptName: "",
    transportFee: "",
    phone: "",
    network: "MTN",
  });
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const transport = Number(form.transportFee) || 0;
  const canSubmit = form.location && form.receiptName && form.phone;

  return (
    <div className="px-4 pb-4">
      <div className="flex items-center gap-2 pt-1 pb-4">
        <button onClick={onBack}><ChevronLeft size={19} /></button>
        <h2 className="text-base font-bold text-gray-900">Delivery & Payment</h2>
      </div>

      <div className="space-y-4">
        <Field icon={MapPin} label="Delivery location">
          <input
            value={form.location}
            onChange={set("location")}
            placeholder="e.g. Ntinda, Kampala"
            className="w-full text-sm outline-none bg-transparent"
          />
        </Field>

        <Field icon={Receipt} label="Name for receipt">
          <input
            value={form.receiptName}
            onChange={set("receiptName")}
            placeholder="Full name"
            className="w-full text-sm outline-none bg-transparent"
          />
        </Field>

        <Field icon={Truck} label="Transport fee (UGX)">
          <input
            value={form.transportFee}
            onChange={set("transportFee")}
            type="number"
            placeholder="e.g. 10000"
            className="w-full text-sm outline-none bg-transparent"
          />
        </Field>

        <Field icon={PhoneIcon} label="Phone number to be charged">
          <input
            value={form.phone}
            onChange={set("phone")}
            placeholder="e.g. 0772 123 456"
            className="w-full text-sm outline-none bg-transparent"
          />
        </Field>

        <div>
          <p className="text-xs font-medium text-gray-500 mb-2">Pay with</p>
          <div className="flex gap-3">
            {["MTN", "Airtel"].map((n) => (
              <button
                key={n}
                onClick={() => setForm((f) => ({ ...f, network: n }))}
                className={`flex-1 py-3 rounded-xl border text-sm font-semibold ${
                  form.network === n
                    ? n === "MTN"
                      ? "border-amber-400 bg-amber-50 text-amber-700"
                      : "border-red-400 bg-red-50 text-red-600"
                    : "border-gray-200 text-gray-500"
                }`}
              >
                {n} Mobile Money
              </button>
            ))}
          </div>
        </div>
      </div>

      <div className="mt-6 border-t border-gray-100 pt-4 space-y-1.5">
        <div className="flex justify-between text-sm text-gray-500">
          <span>Subtotal</span><span>{fmt(subtotal)}</span>
        </div>
        <div className="flex justify-between text-sm text-gray-500">
          <span>Transport</span><span>{fmt(transport)}</span>
        </div>
        <div className="flex justify-between text-base font-bold text-gray-900 pt-1">
          <span>Total</span><span>{fmt(subtotal + transport)}</span>
        </div>
      </div>

      <button
        disabled={!canSubmit}
        onClick={() => onSubmit(form, subtotal + transport)}
        className={`w-full text-sm font-semibold py-3 rounded-xl mt-5 ${
          canSubmit ? "bg-blue-600 text-white" : "bg-gray-200 text-gray-400"
        }`}
      >
        Submit & Pay with {form.network}
      </button>
      {checkoutError && <p className="text-xs text-red-500 text-center mt-3">{checkoutError}</p>}
    </div>
  );
}

function Field({ icon: Icon, label, children }) {
  return (
    <div>
      <p className="text-xs font-medium text-gray-500 mb-1.5">{label}</p>
      <div className="flex items-center gap-2 bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5">
        <Icon size={15} className="text-gray-400 shrink-0" />
        {children}
      </div>
    </div>
  );
}

function ProcessingScreen({ network, phone }) {
  return (
    <div className="px-4 pt-20 flex flex-col items-center text-center">
      <div className="w-14 h-14 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin" />
      <p className="text-sm font-semibold text-gray-900 mt-5">Check your phone</p>
      <p className="text-xs text-gray-400 mt-1 max-w-[260px]">
        A {network} Mobile Money prompt has been sent to {phone}. Enter your PIN there to approve the payment.
      </p>
      <p className="text-[11px] text-gray-300 mt-4">Waiting for confirmation…</p>
    </div>
  );
}

function PaymentFailedScreen({ message, onRetry, onBack }) {
  return (
    <div className="px-4 pt-16 flex flex-col items-center text-center">
      <div className="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center">
        <X size={26} className="text-red-500" />
      </div>
      <h2 className="text-lg font-bold text-gray-900 mt-4">Payment didn't go through</h2>
      <p className="text-sm text-gray-500 mt-1 max-w-[280px]">{message}</p>
      <div className="flex gap-3 mt-6">
        <button onClick={onBack} className="text-sm font-medium px-5 py-3 rounded-xl border border-gray-200 text-gray-600">
          Back to cart
        </button>
        <button onClick={onRetry} className="bg-blue-600 text-white text-sm font-semibold px-5 py-3 rounded-xl">
          Try again
        </button>
      </div>
    </div>
  );
}

function SuccessScreen({ orderRef, onDone }) {
  return (
    <div className="px-4 pt-16 flex flex-col items-center text-center">
      <div className="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center">
        <Check size={28} className="text-green-600" />
      </div>
      <h2 className="text-lg font-bold text-gray-900 mt-4">Order placed!</h2>
      <p className="text-sm text-gray-500 mt-1">
        Order #{orderRef ? orderRef.slice(0, 8).toUpperCase() : ""} is confirmed and being prepared. We'll call you to confirm delivery.
      </p>
      <button onClick={onDone} className="mt-6 bg-blue-600 text-white text-sm font-semibold px-6 py-3 rounded-xl">
        Back to Home
      </button>
    </div>
  );
}

/* ============================================================================
   ACCOUNT SCREEN
   ============================================================================ */

function AccountScreen() {
  return (
    <div className="px-4 pt-2 pb-4">
      <div className="flex items-center gap-3 py-3">
        <div className="w-14 h-14 rounded-full bg-blue-600 flex items-center justify-center">
          <User size={22} className="text-white" />
        </div>
        <div>
          <p className="text-sm font-semibold text-gray-900">Guest shopper</p>
          <p className="text-xs text-gray-400">Sign in to track your orders</p>
        </div>
      </div>
      <div className="mt-3 divide-y divide-gray-100 border border-gray-100 rounded-xl overflow-hidden">
        {["My orders", "Saved addresses", "Help & support"].map((it) => (
          <button key={it} className="w-full flex items-center justify-between px-4 py-3.5 text-sm text-gray-700">
            {it} <ChevronRight size={15} className="text-gray-300" />
          </button>
        ))}

      <p className="text-center text-[11px] text-gray-300 mt-8">
        Shop owner? Manage products from the separate Admin Dashboard app.
      </p>

/* Product management now lives in its own app — see AdminDashboard.jsx.
   It reads and writes the same "sunshine_gadgets_products_v1" localStorage
   key as this app, so products it uploads, edits, or deletes appear here
   too whenever both are served from the same origin. */
/* removed: legacy in-app admin dashboard (AdminGate / AdminDashboard / AdminInput) */
/* ============================================================================
   ROOT APP
   ============================================================================ */

function SunshineGadgetsApp() {
  const [booted, setBooted] = useState(false);
  React.useEffect(() => {
    const t = setTimeout(() => setBooted(true), 1600);
    return () => clearTimeout(t);
  }, []);

  const [products, setProducts] = useState([]);
  const [productsLoading, setProductsLoading] = useState(true);
  const [offlineDemo, setOfflineDemo] = useState(false);

  // Load the real catalog from Supabase, and stay live-synced: any product
  // the admin adds, edits, or deletes anywhere shows up here automatically.
  React.useEffect(() => {
    let unsub = () => {};
    fetchProducts()
      .then((data) => { setProducts(data); setProductsLoading(false); })
      .catch(() => {
        // config.js hasn't been filled in with real Supabase credentials yet —
        // fall back to demo data so the app is still browsable while you set up.
        setProducts(seedProducts());
        setOfflineDemo(true);
        setProductsLoading(false);
      });
    if (!offlineDemo) unsub = subscribeToProducts(setProducts);
    return () => unsub();
  }, []);

  const [view, setView] = useState("home"); // home | categories | product | cart | checkout | payment | payment-failed | success | account
  const [navTab, setNavTab] = useState("home");
  const [browseFilter, setBrowseFilter] = useState("All");
  const [selectedId, setSelectedId] = useState(null);
  const [cart, setCart] = useState([]);
  const [checkoutError, setCheckoutError] = useState("");
  const [processingInfo, setProcessingInfo] = useState({ network: "MTN", phone: "" });
  const [failureMessage, setFailureMessage] = useState("");
  const [pendingOrderRef, setPendingOrderRef] = useState(null);
  const [lastOrderRef, setLastOrderRef] = useState(null);

  const selectedProduct = products.find((p) => p.id === selectedId);
  const cartCount = cart.reduce((s, c) => s + c.qty, 0);

  /* ---- cart actions ---- */
  const addToCart = (product, variant, color) => {
    const key = `${product.id}-${variant}-${color}`;
    setCart((prev) => {
      const existing = prev.find((c) => c.key === key);
      if (existing) return prev.map((c) => (c.key === key ? { ...c, qty: c.qty + 1 } : c));
      return [...prev, { key, product, variant, color, qty: 1 }];
    });
  };
  const quickAdd = (product) => addToCart(product, product.variants[0], product.colors[0]);
  const changeQty = (key, delta) => {
    setCart((prev) =>
      prev
        .map((c) => (c.key === key ? { ...c, qty: Math.max(1, c.qty + delta) } : c))
    );
  };
  const removeFromCart = (key) => setCart((prev) => prev.filter((c) => c.key !== key));

  /* ---- real checkout: create the order in Supabase, then trigger a real
     MarzPay MTN/Airtel Mobile Money collection and wait for confirmation ---- */
  const runPayment = async (orderRef, network, phone) => {
    setProcessingInfo({ network, phone });
    setView("payment");
    try {
      await startMarzPayCollection(orderRef);
    } catch (err) {
      setFailureMessage(err.message || "Couldn't start the payment prompt. Please try again.");
      setView("payment-failed");
      return;
    }
    const status = await pollOrderStatus(orderRef);
    if (status === "paid") {
      setLastOrderRef(orderRef);
      setCart([]);
      setView("success");
    } else if (status === "timeout") {
      setFailureMessage("We didn't get confirmation in time. If money left your account, contact support with this order reference before retrying.");
      setView("payment-failed");
    } else {
      setFailureMessage("The payment was declined or cancelled on your phone.");
      setView("payment-failed");
    }
  };

  const submitCheckout = async (form, total) => {
    setCheckoutError("");
    if (offlineDemo) {
      setCheckoutError("Not connected to Supabase yet — checkout needs a real database. See config.js / SETUP.md.");
      return;
    }
    const subtotal = cart.reduce((s, c) => s + c.product.price * c.qty, 0);
    try {
      const order = await createOrder({
        receiptName: form.receiptName,
        phone: form.phone,
        location: form.location,
        network: form.network,
        transportFee: Number(form.transportFee) || 0,
        subtotal,
        total,
        cart,
      });
      setPendingOrderRef(order.order_ref);
      await runPayment(order.order_ref, form.network, form.phone);
    } catch (err) {
      setCheckoutError("Couldn't start checkout — please try again.");
    }
  };

  const retryPayment = () => {
    if (pendingOrderRef) runPayment(pendingOrderRef, processingInfo.network, processingInfo.phone);
  };

  /* ---- navigation helpers ---- */
  const goHome = () => { setView("home"); setNavTab("home"); };
  const openProduct = (id) => { setSelectedId(id); setView("product"); };
  const goCategory = (cat) => { setBrowseFilter(cat); setView("categories"); setNavTab("categories"); };
  const goCart = () => { setView("cart"); setNavTab("cart"); };

  const handleNav = (key) => {
    setNavTab(key);
    if (key === "home") setView("home");
    else if (key === "categories") { setBrowseFilter("All"); setView("categories"); }
    else if (key === "deals") { setBrowseFilter("__deals"); setView("categories"); }
    else if (key === "account") setView("account");
    else if (key === "cart") setView("cart");
  };

  const relatedFor = (p) =>
    products.filter((x) => x.category === p.category && x.id !== p.id).slice(0, 6);

  return (
    <div className="w-full min-h-screen flex items-start justify-center bg-gray-100 py-6">
      <div className="w-full bg-white flex flex-col relative" style={{ maxWidth: 420, minHeight: 780, borderRadius: 28, overflow: "hidden", boxShadow: "0 20px 50px rgba(0,0,0,0.12)" }}>
        {!booted && <SplashScreen />}
        {offlineDemo && booted && (
          <div className="bg-amber-50 text-amber-700 text-[11px] text-center py-1.5 px-3">
            Demo data — not connected to Supabase yet. Edit config.js.
          </div>
        )}
        {view !== "product" && view !== "checkout" && view !== "payment" && view !== "payment-failed" && view !== "success" && (
          <BuyerHeader
            cartCount={cartCount}
            onSearchFocus={() => { setBrowseFilter("All"); setView("categories"); setNavTab("categories"); }}
            onCartClick={goCart}
            onAccountClick={() => { setView("account"); setNavTab("account"); }}
          />
        )}

        <div className="flex-1 overflow-y-auto">
          {view === "home" && (
            <HomeScreen products={products} onOpenProduct={openProduct} onGoCategory={goCategory} onQuickAdd={quickAdd} />
          )}

          {view === "categories" && (
            <BrowseScreen
              products={products}
              activeFilter={browseFilter}
              onFilter={setBrowseFilter}
              onOpenProduct={openProduct}
              onQuickAdd={quickAdd}
            />
          )}

          {view === "product" && selectedProduct && (
            <ProductDetail
              product={selectedProduct}
              related={relatedFor(selectedProduct)}
              onBack={() => setView(navTab === "categories" ? "categories" : "home")}
              onAddToCart={(p, v, c) => addToCart(p, v, c)}
              onBuyNow={(p, v, c) => { addToCart(p, v, c); goCart(); }}
              onOpenProduct={openProduct}
            />
          )}

          {view === "cart" && (
            <CartScreen
              cart={cart}
              onQty={changeQty}
              onRemove={removeFromCart}
              onCheckout={() => setView("checkout")}
              onContinueShopping={goHome}
            />
          )}

          {view === "checkout" && (
            <CheckoutScreen
              cart={cart}
              onBack={() => setView("cart")}
              onSubmit={submitCheckout}
              checkoutError={checkoutError}
            />
          )}

          {view === "payment" && <ProcessingScreen network={processingInfo.network} phone={processingInfo.phone} />}

          {view === "payment-failed" && (
            <PaymentFailedScreen
              message={failureMessage}
              onRetry={retryPayment}
              onBack={() => setView("cart")}
            />
          )}

          {view === "success" && (
            <SuccessScreen orderRef={lastOrderRef} onDone={goHome} />
          )}

          {view === "account" && <AccountScreen />}
        </div>

        {view !== "product" && view !== "checkout" && view !== "payment" && view !== "payment-failed" && view !== "success" && (
          <BottomNav active={navTab} onChange={handleNav} cartCount={cartCount} />
        )}
      </div>

      <style>{`
        .no-scrollbar::-webkit-scrollbar{display:none} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
      `}</style>
    </div>
  );
}


createRoot(document.getElementById("root")).render(<SunshineGadgetsApp />);
</script>
</body>
</html>
